<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c3426" />

    <!-- Primary SEO (per-page titles/descriptions are set at runtime by usePageMeta) -->
    <title>AyurSetu | Ayurveda &amp; AYUSH Internships in India</title>
    <meta
      name="description"
      content="AyurSetu connects Ayurveda, Yoga and AYUSH students with curated internships at India's top research labs, clinical centers and wellness organizations."
    />
    <meta name="author" content="AyurSetu Foundation" />
    <link
      rel="canonical"
      href="https://www.ayursetu.in/"
    />
    <link
      rel="alternate"
      hrefLang="en-in"
      href="https://www.ayursetu.in/"
    />

    <!-- Open Graph / social previews (update the domain when deploying) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AyurSetu" />
    <meta property="og:url" content="https://www.ayursetu.in/" />
    <meta property="og:title" content="AyurSetu | Ayurveda &amp; AYUSH Internships in India" />
    <meta
      property="og:description"
      content="AyurSetu connects Ayurveda, Yoga and AYUSH students with curated internships at India's top research labs, clinical centers and wellness organizations."
    />
    <meta property="og:image" content="https://www.ayursetu.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AyurSetu — find your Ayurvedic internship" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AyurSetu | Ayurveda &amp; AYUSH Internships in India" />
    <meta
      name="twitter:description"
      content="AyurSetu connects Ayurveda, Yoga and AYUSH students with curated internships at India's top research labs and wellness organizations."
    />
    <meta name="twitter:image" content="https://www.ayursetu.in/og-image.png" />

    <!-- Favicon set -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AyurSetu" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
